# ==============================================================================
# N100 FINANCIAL INTELLIGENCE PLATFORM — SCREENER CONFIGURATION
# Sprint 3: Screener & Peer Comparison Engine
# ==============================================================================

screener_settings:
  default_year: "2024"
  composite_weights:
    profitability:
      weight: 0.35
      sub_components:
        roe: 0.15
        roce: 0.10
        npm: 0.10
    cash_quality:
      weight: 0.30
      sub_components:
        fcf_cagr_5yr: 0.15
        cfo_pat_ratio: 0.10
        fcf_positive_flag: 0.05
    growth:
      weight: 0.20
      sub_components:
        revenue_cagr_5yr: 0.10
        pat_cagr_5yr: 0.10
    leverage:
      weight: 0.15
      sub_components:
        debt_to_equity: 0.10
        interest_coverage: 0.05
  winsorisation:
    lower_percentile: 10.0
    upper_percentile: 90.0

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "Consistent compounding businesses with high capital returns, low leverage, and positive FCF"
    filters:
      roe_min: 15.0
      de_max: 1.0
      fcf_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Undervalued companies with attractive valuation multiples, moderate leverage, and dividends"
    filters:
      pe_max: 20.0
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High-momentum companies with aggressive multi-year revenue and profit CAGR"
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      de_max: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "Generous income generators with sustainable payout coverage and positive free cash flows"
    filters:
      dividend_yield_min: 2.0
      dividend_payout_max: 80.0
      fcf_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Large enterprise leaders with virtually zero debt, solid ROE, and scale (>₹5,000 Cr Sales)"
    filters:
      de_max: 0.05
      roe_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Recovering enterprises displaying 3-year revenue revival, positive FCF, and YoY balance sheet deleveraging"
    filters:
      revenue_cagr_3yr_min: 10.0
      fcf_min: 0.0
      de_declining_yoy: true
